<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List — Киселев Максим</title>
<link rel="stylesheet" href="dist/css/main.css">
</head>
<body class="min-h-screen bg-gray-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors">

<header class="sticky top-0 z-10 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
  <div class="max-w-3xl mx-auto flex flex-wrap items-center gap-4 p-4 sm:p-6">
    <h1 class="flex-1 text-xl sm:text-2xl font-bold text-blue-800 dark:text-blue-400">
      📝 To-Do List
    </h1>
    <div class="flex items-center gap-2">
      <button
        type="button"
        class="js-theme-toggle inline-flex items-center justify-center w-10 h-10 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-500"
        aria-label="Переключить тему">
        <span aria-hidden="true">🌙</span>
      </button>
      <button
        type="button"
        class="js-add-task inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-blue-700 text-white font-medium hover:bg-blue-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-500">
        <span aria-hidden="true">➕</span> Добавить
      </button>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto p-4 sm:p-6 space-y-10">

  <!-- Поиск -->
  <section>
    <label for="search" class="sr-only">Поиск задач</label>
    <input
      type="search"
      id="search"
      class="js-search w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-500"
      placeholder="Найти задачу..."
      autocomplete="off">
  </section>

  <!-- Активные -->
  <section aria-labelledby="active-title">
    <h2 id="active-title" class="flex items-center gap-2 mb-4 text-lg font-semibold text-slate-900 dark:text-slate-100">
      <span class="w-1 h-5 bg-blue-700 dark:bg-blue-400 rounded" aria-hidden="true"></span>
      Активные
    </h2>
    <ul class="js-list-active space-y-2"></ul>
    <p class="js-empty-active hidden text-center italic text-slate-500 dark:text-slate-400 py-8">
      Активных задач нет
    </p>
  </section>

  <!-- Выполненные -->
  <section aria-labelledby="done-title">
    <h2 id="done-title" class="flex items-center gap-2 mb-4 text-lg font-semibold text-slate-900 dark:text-slate-100">
      <span class="w-1 h-5 bg-blue-700 dark:bg-blue-400 rounded" aria-hidden="true"></span>
      Выполненные
    </h2>
    <ul class="js-list-done space-y-2"></ul>
    <p class="js-empty-done hidden text-center italic text-slate-500 dark:text-slate-400 py-8">
      Выполненных задач нет
    </p>
  </section>

</main>

<!-- Модальное окно -->
<dialog
  class="js-dialog rounded-lg p-0 max-w-[min(90vw,480px)] w-full bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 backdrop:bg-black/60"
  aria-labelledby="dialog-title">
  <form method="dialog" class="js-form p-6">
    <h2 id="dialog-title" class="mb-4 text-lg font-semibold">Новая задача</h2>

    <label class="block mb-4">
      <span class="block text-sm font-medium mb-1">Название задачи</span>
      <input
        type="text"
        id="task-title"
        name="title"
        class="js-task-input w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-500"
        required
        autocomplete="off"
        maxlength="200">
    </label>

    <div class="flex gap-2 justify-end mt-4">
      <button
        type="button"
        class="js-cancel px-4 py-2 rounded-lg text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-500">
        Отмена
      </button>
      <button
        type="submit"
        class="px-4 py-2 rounded-lg bg-blue-700 text-white font-medium hover:bg-blue-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-500">
        Сохранить
      </button>
    </div>
  </form>
</dialog>

<script src="js/main.js"></script>
</body>
</html>
